[package]
name = "demo-printer-guard"
description = "Print only through the guard: printer.guard checks a G-code job against a policy and forwards a single-use call to the printer twin."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "demo-printer-guard"

[dependencies]
gcode-lint = { path = "crates/gcode-lint" }
printer-guard = { path = "crates/printer-guard" }
twin-door = { path = "crates/twin-door" }
wire = { path = "crates/wire" }
ce-net-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

[workspace]
resolver = "2"
members = [".", "crates/gcode-lint", "crates/printer-guard", "crates/twin-door", "crates/wire"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Leif Rydenfalk <59741378+Leif-Rydenfalk@users.noreply.github.com>"]
repository = "https://github.com/ce-net/demo-printer-guard"

[workspace.dependencies]
# The open capability token (cap v3), pinned to a public commit.
ce-net-proto = { git = "https://github.com/ce-net/ce-net-proto", rev = "ff449250618cc70bde491055cb97e8ef42121390" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
